[build]
# Disable hashing in filenames for cleaner output
filehash = false
# Minify JavaScript and CSS
minify = "on_release"
# Disable SRI (Subresource Integrity) to reduce file size
no_sri = true
# Use relative paths instead of absolute paths
public_url = "./"

[watch]
# Fast rebuild on file changes
poll = false

[serve]
# Enable HTTP/2 push for faster delivery
port = 8080
