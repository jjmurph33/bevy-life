[package]
name = "bevy-life"
version = "0.1.0"
edition = "2024"

# Enable a small amount of optimization in the dev profile for faster iteration with a responsive debug build.
[profile.dev]
opt-level = 1

# Optimize dependencies more aggressively in dev to improve iteration times when using Bevy.
[profile.dev.package."*"]
opt-level = 3

# Release profile tuned for Bevy (size and performance):
# - opt-level = "z" for size; use 3 if maximum perf is preferred.
# - lto = true and codegen-units = 1 for best LTO results.
# - panic = "abort" is recommended for smaller binaries (and required for some targets like wasm32).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["dev","2d","ui"] }
rand = { version = "0.9.2", features = ["small_rng"] }

# WASM dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["2d","ui","web","webgl2"] }
