# for Linux
# apt install mold clang
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C",
    "link-arg=-fuse-ld=/usr/bin/mold",
    # (Nightly) Make the current crate share its generic instantiations
    "-Zshare-generics=y",]

# for Windows
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
